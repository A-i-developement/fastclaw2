# pnpm v12+ reads overrides from pnpm-workspace.yaml instead of package.json.
# These overrides address known vulnerable dependency ranges while keeping
# the lockfile reproducible with `pnpm install --frozen-lockfile`.
overrides:
  ip-address@<10.1.1: '>=10.1.1'
  postcss@<8.5.10: '>=8.5.10'
allowBuilds:
  msw: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - msw
  - sharp
  - unrs-resolver
